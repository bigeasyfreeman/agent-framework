eval:
  name: no-secrets-in-claude-config
  description: Ensure no secrets or tokens are stored in .claude configs or history.

  assertions:
    never_contains:
      - regex: "sk-[A-Za-z0-9]{20,}"
      - regex: "ghp_[A-Za-z0-9]{30,}"
      - regex: "github_pat_[A-Za-z0-9_]{20,}"
      - regex: "censys_[A-Za-z0-9]{8,}"
      - regex: "SHODAN_API_KEY\\s*=\\s*['\\\"][^'\\\"]+['\\\"]"
      - regex: "api[_-]?key\\s*=\\s*['\\\"][^'\\\"]+['\\\"]"

